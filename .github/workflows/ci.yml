name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runners are pinned to ubuntu-24.04, the image ubuntu-latest resolved to
# until GitHub began moving it to Ubuntu 26.04 (rollout 2026-10-19 to
# 2026-11-19). Move the label on purpose, after the jobs pass on
# ubuntu-26.04, so an image change never lands mid-review.
jobs:
  ci:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/

      - name: Type check (mypy)
        run: mypy src/machina

      - name: Tests
        run: pytest tests/ -v --cov=machina --cov-report=term-missing --cov-report=xml

      - name: Per-module coverage floors (core modules)
        # Floors set below the measured baseline with a ~5% buffer so
        # refactors have headroom but a silent regression in any core
        # module fails CI. Floors cover core modules only; optional-dep
        # modules (excel, calendar, litellm, mcp) are exercised by the
        # ci-extras job below without floors.
        run: |
          coverage report --include='src/machina/agent/**'         --fail-under=88
          coverage report --include='src/machina/config/**'        --fail-under=95
          coverage report --include='src/machina/llm/**'           --fail-under=80
          coverage report --include='src/machina/observability/**' --fail-under=85
          coverage report --include='src/machina/workflows/**'     --fail-under=90

      # Codecov merges every upload for a commit into one report. This job
      # installs no optional extras, so its report alone shows 0% for the
      # modules only ci-extras imports (mcp, excel, calendar, litellm); the
      # `core` and `extras` flags keep the two uploads apart.
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: core
          name: core-py3.12
          fail_ci_if_error: false

  ci-extras:
    name: Tests with optional extras (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (targeted extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,excel,calendar,litellm,mcp]"

      - name: Tests (incl. previously-skipped optional-dep suites)
        run: pytest tests/ -v --cov=machina --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: extras
          name: extras-py3.12
          fail_ci_if_error: false

  # Installs the litellm extra the way `pip install machina-ai[litellm]` does,
  # without mcp. ci-extras installs mcp next to litellm, so it cannot see a
  # litellm release that needs a package this extra does not declare (#160).
  # Python 3.11 is the package floor and the odl-generator template's image.
  ci-litellm-only:
    name: Tests with the litellm extra alone (Python 3.11)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies (litellm extra only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,litellm]"

      # The real-litellm tests skip when litellm is missing, so a green run
      # means something only when litellm is installed and mcp is not.
      - name: Check the installed set
        shell: python
        run: |
          import importlib.metadata
          import importlib.util
          import sys

          if importlib.util.find_spec("litellm") is None:
              sys.exit("litellm is not installed")
          if importlib.util.find_spec("mcp") is not None:
              sys.exit("mcp is installed; this job must run without it")
          print("litellm", importlib.metadata.version("litellm"), "installed; mcp absent")

      - name: Tests
        run: pytest tests/ -v

  validate-examples:
    name: Validate examples & doc snippets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate doc snippets (syntax + imports)
        run: python tests/validate_doc_snippets.py

      - name: Validate example scripts (syntax + imports)
        run: python tests/validate_examples.py

      - name: Validate workflow action strings
        run: pytest tests/test_example_actions.py -v

      - name: Validate model attribute access
        run: python tests/validate_model_access.py

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Docs coverage (public API, connectors, migration version)
        run: python tests/validate_docs_coverage.py

      - name: Build docs (strict)
        run: mkdocs build --strict
