# Each commit gets two coverage uploads from .github/workflows/ci.yml:
# `core` (ci, Python 3.12, no optional extras) and `extras` (ci-extras,
# Python 3.12, with the mcp/excel/calendar/litellm extras). Wait for both
# before posting statuses or the PR comment, so neither is computed from the
# core report alone, which shows the extras-only modules at 0%.
codecov:
  notify:
    after_n_builds: 2

comment:
  after_n_builds: 2

# With the default `target: auto`, codecov/patch compares against the base
# report and, when the PR has none, passes with "No report found to compare
# against" without measuring anything. An explicit target is measured against
# the PR's own diff whether or not a base report exists. This does not fix a
# wrong base; scripts/codecov_base_check.py checks that (see CONTRIBUTING.md).
coverage:
  status:
    patch:
      default:
        target: 100%
