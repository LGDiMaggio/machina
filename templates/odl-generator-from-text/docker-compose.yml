# The agent reads requests from the terminal, so run it interactively:
#
#   docker compose run --rm machina           # sandbox (default)
#   docker compose run --rm machina --live    # writes data/workorders.xlsx
#
# ./data is mounted so the registry you edit and the work orders the agent
# writes live on the host.

services:
  machina:
    build: .
    env_file: .env
    stdin_open: true
    tty: true
    volumes:
      - ./data:/home/machina/app/data
