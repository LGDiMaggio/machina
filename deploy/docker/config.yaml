# Machina MCP server configuration for the Docker deployment.
#
# ${VAR} is read from the environment (docker compose passes .env and the
# defaults in docker-compose.yml); ${VAR:-default} falls back to the default
# when VAR is unset or empty. The MCP server makes no LLM calls, so there is
# no llm: section.

name: "Machina MCP Server"
description: "Maintenance data over MCP (Docker deployment)"

plant:
  name: "Demo Plant"
  location: "Docker Environment"

connectors:
  cmms:
    type: generic_cmms
    primary: true
    settings:
      url: "${MACHINA_CMMS_URL}"
      api_key: "${MACHINA_CMMS_API_KEY}"
      # Optional REST endpoints (paths relative to url). Each one adds tools:
      # get_work_order → machina_get_work_order; update_work_order →
      # machina_update/close/cancel_work_order; read_maintenance_plans →
      # machina_get_maintenance_plan.
      endpoints:
        get_work_order:
          path: "work_orders/{id}"
        update_work_order:
          path: "work_orders/{id}"
          method: PATCH
        read_maintenance_plans:
          path: "maintenance_plans"

# Writes are logged and answered with a [SANDBOX] result until you set
# MACHINA_SANDBOX_MODE=false.
sandbox: "${MACHINA_SANDBOX_MODE:-true}"

logging:
  level: "${MACHINA_LOG_LEVEL:-INFO}"

mcp:
  enable_vendor_tools: false
